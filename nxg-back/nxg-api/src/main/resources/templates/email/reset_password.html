<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        .btn { background: #1890ff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin: 20px 0; }
    </style>
</head>
<body>
<div style="font-family: Arial, sans-serif; line-height: 1.6;">
    <h3>重置您的登录密码</h3>
    <p>我们收到请求，希望为您的账号重置密码。请点击下方按钮进行操作：</p>
    <a class="btn" th:href="${resetLink}" target="_blank">立即重置密码</a>
    <p>如果按钮无法点击，请复制以下链接到浏览器打开：</p>
    <p th:text="${resetLink}" style="color: #666; font-size: 12px;"></p>
    <p>如果您并未请求重置密码，请忽略此邮件。</p>
</div>
</body>
</html>
