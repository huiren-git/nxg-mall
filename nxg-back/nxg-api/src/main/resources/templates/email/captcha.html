<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>安全验证码</title>
    <style>
        .container { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e9e9e9; }
        .header { color: #333; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .code { color: #1890ff; font-size: 32px; font-weight: bold; letter-spacing: 5px; margin: 20px 0; }
        .footer { color: #999; font-size: 12px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">安全验证</div>
    <p>您好！您正在进行 <strong th:text="${sceneName}">注册</strong> 操作。</p>
    <p>您的验证码为：</p>
    <div class="code" th:text="${code}">123456</div>
    <p>该验证码在 5 分钟内有效，请勿向他人泄露。</p>
    <div class="footer">
        此邮件由系统自动发出，请勿直接回复。
    </div>
</div>
</body>
</html>
